name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 2
          command: composer update --no-interaction --no-progress

      - name: Install PHPStan
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 2
          command: composer bin phpstan update --no-interaction --no-progress

      - name: Execute PHPStan
        run: vendor/bin/phpstan analyze --no-progress

  psalm:
    name: Psalm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 2
          command: composer update --no-interaction --no-progress

      - name: Install Psalm
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 2
          command: composer bin psalm update --no-interaction --no-progress --ignore-platform-req=php

      - name: Execute Psalm
        run: vendor/bin/psalm --no-progress --output-format=github
